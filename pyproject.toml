[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "alexvolkihar-sokoban"
dynamic = ["version"]
description = "A Sokoban game with level packs, a push-based solver, benchmarks, themes and saves."
readme = "README.en.md"
license = "MIT"
license-files = [
    "LICENSE",
    "src/alexvolkihar_sokoban/data/levels/boxoban-hard.LICENSE.txt",
    "src/alexvolkihar_sokoban/data/themes/kenney/LICENSE.txt",
]
requires-python = ">=3.11"
authors = [
    { name = "Alexis MABANZA" },
]
keywords = ["sokoban", "puzzle", "game", "pygame", "solver"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Natural Language :: French",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Puzzle Games",
]
dependencies = [
    "pygame-ce>=2.5",
    "platformdirs>=4",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "jsonschema"]
media = ["imageio", "imageio-ffmpeg"]

[project.scripts]
alexvolkihar-sokoban = "alexvolkihar_sokoban.cli:main"

[project.urls]
Homepage = "https://github.com/Alexvolkihar/alexvolkihar_sokoban"
Source = "https://github.com/Alexvolkihar/alexvolkihar_sokoban"
Issues = "https://github.com/Alexvolkihar/alexvolkihar_sokoban/issues"
Changelog = "https://github.com/Alexvolkihar/alexvolkihar_sokoban/blob/main/CHANGELOG.md"
Original = "https://github.com/Alexvolkihar/Sokoban-LAMA"

[tool.hatch.version]
path = "src/alexvolkihar_sokoban/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/alexvolkihar_sokoban"]
# Bundled data under src/alexvolkihar_sokoban/data/ ships with the package; the JSON schemas live at the
# repository root and are copied into the package (importlib.resources: alexvolkihar_sokoban/schemas/).

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "alexvolkihar_sokoban/schemas"

[tool.hatch.build.targets.sdist]
exclude = ["legacy/", ".github/", ".superpowers/"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TID"]

[tool.ruff.lint.flake8-bugbear]
# Frozen dataclasses used as default arguments (e.g. `limits: SolveLimits = SolveLimits()`).
extend-immutable-calls = ["alexvolkihar_sokoban.solver.api.SolveLimits"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pygame".msg = "pygame only in ui/"

[tool.ruff.lint.per-file-ignores]
"src/alexvolkihar_sokoban/ui/**" = ["TID251"]
"src/alexvolkihar_sokoban/commands/play.py" = ["TID251"]
"tests/ui/**" = ["TID251"]
"tests/commands/test_play.py" = ["TID251"]
"scripts/**" = ["TID251"]

[tool.mypy]
files = ["src"]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = [
    "alexvolkihar_sokoban",
    "alexvolkihar_sokoban.__main__",
    "alexvolkihar_sokoban.cli",
    "alexvolkihar_sokoban.commands.*",
    "alexvolkihar_sokoban.core.*",
    "alexvolkihar_sokoban.formats.*",
    "alexvolkihar_sokoban.solver.*",
    "alexvolkihar_sokoban.generator.*",
    "alexvolkihar_sokoban.scoring.*",
    "alexvolkihar_sokoban.persistence.*",
    "alexvolkihar_sokoban.benchmark.*",
]
# Per-module equivalent of --strict (a per-module `strict = true` leaks to every module).
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
module = ["pygame", "pygame.*"]
ignore_missing_imports = true  # pygame-ce ships its own stubs; kept as a safety net

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode: test files in different folders may share a basename (no __init__.py in tests/).
addopts = ["--import-mode=importlib"]
